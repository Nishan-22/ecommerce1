name: Feature Request
description: Suggest an idea for ShoeShop
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please describe the problem you're trying to solve and the feature you have in mind.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve for you or your users?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should the feature look or behave like?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or alternative approaches you have considered.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I have searched for an existing issue or PR covering this request